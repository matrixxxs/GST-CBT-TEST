function drawLine(c,data){if(!c)return;let ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted');ctx.font='11px system-ui';for(let v=0;v<=100;v+=25){let y=h-25-v/100*(h-45);ctx.beginPath();ctx.moveTo(28,y);ctx.lineTo(w-8,y);ctx.stroke();ctx.fillText(v+'%',2,y+4)}if(!data.length){ctx.fillText('No attempts yet',w/2-35,h/2);return}let max=Math.max(1,data.length-1),pts=data.map((p,i)=>({x:32+i/max*(w-48),y:h-25-p.y/100*(h-45)}));ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent');ctx.lineWidth=2.5;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--accent');pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()})}

</script></body></html>
